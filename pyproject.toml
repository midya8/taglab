[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taglab"
version = "0.3.0"
description = "Inspectable linear-chain conditional random fields with manual gradients and exhaustive witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
packages = ["taglab"]

[tool.setuptools.package-data]
taglab = ["artifacts/*.json", "artifacts/*.b64"]
